<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Chamados</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- ===== Cabeçalho: nome do sistema + abas + botão novo chamado ===== -->
  <header class="topo">
    <div class="container topo__inner">
      <h1 class="topo__logo">Sistema de Chamados</h1>
      <button id="btn-novo-chamado" class="btn btn--primario">+ Novo chamado</button>
    </div>
  </header>

  <main class="container">

    <!-- ===== VIEW: LISTA DE CHAMADOS ===== -->
    <section id="view-chamados" class="view">
      <h2 class="view__titulo">Chamados</h2>

      <!-- Busca, filtros e ordenação -->
      <div class="toolbar">
        <input type="search" id="busca" class="input toolbar__busca" placeholder="Buscar por título ou cliente...">

        <select id="filtro-status" class="input">
          <option value="">Status: todos</option>
          <option value="Aberto">Aberto</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Aguardando cliente">Aguardando cliente</option>
          <option value="Concluído">Concluído</option>
        </select>

        <select id="filtro-prioridade" class="input">
          <option value="">Prioridade: todas</option>
          <option value="Urgente">Urgente</option>
          <option value="Alta">Alta</option>
          <option value="Media">Média</option>
          <option value="Baixa">Baixa</option>
        </select>

        <select id="ordenacao" class="input">
          <option value="recentes">Mais recentes</option>
          <option value="antigos">Mais antigos</option>
          <option value="prioridade">Por prioridade</option>
        </select>
      </div>

      <!-- Mensagens de estado (o JS controla o atributo hidden) -->
      <p id="msg-carregando" class="mensagem mensagem--carregando" hidden>Carregando…</p>
      <p id="msg-erro" class="mensagem mensagem--erro" hidden>Ocorreu um erro ao carregar os chamados. Tente novamente.</p>
      <p id="msg-vazio" class="mensagem mensagem--vazia" hidden>Nenhum chamado encontrado.</p>

      <!-- Lista de chamados (cards de exemplo — o JS pode renderizar aqui) -->
      <ul id="lista-chamados" class="cards"></ul>
    </section>

    <!-- ===== VIEW: FORMULÁRIO (NOVO / EDITAR CHAMADO) ===== -->
    <section id="view-form-chamado" class="view" hidden>
      <h2 class="view__titulo" id="form-titulo">Novo chamado</h2>

      <form id="form-chamado" class="form">
        <div class="form__campo form__campo--cheio">
          <label for="campo-titulo" >Título</label>
          <input type="text" id="campo-titulo" name="titulo" class="input" placeholder="Ex.: Computador não liga" required>
        </div>

        <div class="form__campo form__campo--cheio">
          <label for="campo-cliente">Cliente</label>
          <input type="text" id="campo-cliente" class="input" name="clienteNome" placeholder="Nome do cliente" required>
        </div>

        <div class="form__campo">
          <label for="campo-prioridade">Prioridade</label>
          <select id="campo-prioridade" name="prioridade" class="input">
            <option value="Baixa">Baixa</option>
            <option value="Media" selected>Média</option>
            <option value="Alta">Alta</option>
            <option value="Urgente">Urgente</option>
          </select>
        </div>

        <div class="form__campo">
          <label for="campo-status">Status</label>
          <select id="campo-status" name="status" class="input">
            <option value="Aberto" selected>Aberto</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Aguardando cliente">Aguardando cliente</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>

        <div class="form__acoes form__campo--cheio">
          <button type="submit" class="btn btn--primario">Salvar</button>
          <button type="button" id="btn-cancelar-form" class="btn btn--secundario">Cancelar</button>
        </div>
      </form>
    </section>

  </main>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
